name: CI

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  compose:
    name: Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Use the example values, so a broken .env.example fails here too.
      - name: Create .env from .env.example
        run: cp .env.example .env

      - name: docker compose config
        run: docker compose config -q

      - name: .env.example matches docker-compose.yml
        run: bash scripts/check-env-example.sh

      # The chat service builds from ../chatty-chat, which isn't checked out here, so it is left out.
      - name: Start infra and wait for health checks
        run: docker compose up -d --wait --wait-timeout 180 core-db chat-db redis minio kafka

      - name: Show containers and logs
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail 100

      - name: Stop infra
        if: always()
        run: docker compose down -v

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # Rules and files come from .markdownlint-cli2.jsonc.
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.23.3
