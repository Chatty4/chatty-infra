name: chatty

services:
  core-db:
    image: postgres:17-alpine
    container_name: chatty-core-db
    environment:
      POSTGRES_USER: ${CORE_DB_USER:-core_user}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:-core_pass}
      POSTGRES_DB: ${CORE_DB_NAME:-core_db}
    ports:
      - "127.0.0.1:${CORE_DB_PORT:-5432}:5432"
    volumes:
      - core-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  chat-db:
    image: postgres:17-alpine
    container_name: chatty-chat-db
    environment:
      POSTGRES_USER: ${CHAT_DB_USER:-chat_user}
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-chat_pass}
      POSTGRES_DB: ${CHAT_DB_NAME:-chat_db}
    ports:
      - "127.0.0.1:${CHAT_DB_PORT:-5433}:5432"
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chatty-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # minio/minio is no longer published on Docker Hub or Quay; Chainguard builds MinIO from source.
    # Chainguard's free images only have a "latest" tag, so it is pinned by digest. Update on purpose:
    # docker buildx imagetools inspect cgr.dev/chainguard/minio:latest  (copy the top-level Digest)
    # Pinned: MinIO RELEASE.2026-09-22T19-25-18Z, multi-arch index (amd64, arm64).
    image: cgr.dev/chainguard/minio:latest@sha256:a05a4497e8dce3cb7a7a1bf1872ba5d30ea988f1e8c22c9e0920503761c4b5f1
    container_name: chatty-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
      # Defines the "local" alias that the health check below uses.
      MC_HOST_local: http://${MINIO_ROOT_USER:-minio_user}:${MINIO_ROOT_PASSWORD:-minio_password}@localhost:9000
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node KRaft (no Zookeeper). Two listeners, because a client connects to whatever address
  # the broker advertises:
  #   kafka:29092     (INTERNAL)  for containers on the compose network: core and chat
  #   localhost:9092  (PLAINTEXT) for apps and tools running on the host
  kafka:
    image: apache/kafka:3.9.0
    container_name: chatty-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # chatty-core (Django, ASGI), built from ../chatty-core. The code is mounted, so --reload picks up changes.
  # On every container start: pending migrations are applied, then a background loop purges refresh
  # tokens expired or revoked more than 30 days ago, once a day (CHAT-256).
  # shortcut: the 24h timer restarts with the container; production needs a real scheduled job.
  # The health check comes from chatty-core's Dockerfile (GET /health).
  core:
    build: ../chatty-core
    image: chatty-core:dev
    # chatty-chat calls http://chatty-core:8000/internal/... (api-internal.md), so the name is fixed.
    container_name: chatty-core
    # exec: uvicorn replaces the shell, so it gets docker's stop signal directly.
    command: sh -c "python manage.py migrate --noinput && { (while true; do python manage.py purge_refresh_tokens; sleep 86400; done) & exec uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload; }"
    env_file:
      - path: ../chatty-core/.env
        required: false
    environment:
      # Service names and ports inside the network; these win over chatty-core/.env.
      DATABASE_URL: postgres://${CORE_DB_USER:-core_user}:${CORE_DB_PASSWORD:-core_pass}@core-db:5432/${CORE_DB_NAME:-core_db}
      REDIS_URL: redis://redis:6379/0
      # One key pair per developer, created once by setup.bat in chatty-core/keys (mounted with the
      # code at /app). Never generated on start: a new pair logs everyone out.
      JWT_PRIVATE_KEY_PATH: /app/keys/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /app/keys/jwt_public.pem
      SECRET_KEY: ${CORE_SECRET_KEY:-dev-only-not-secret}
      DEBUG: "True"
      # chatty-core is the Host header on calls from chatty-chat; Django rejects hosts not listed here.
      ALLOWED_HOSTS: localhost,127.0.0.1,chatty-core,core
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN:-change-me}
      # File change events don't reach Linux containers from Windows mounts; poll instead.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:${CORE_API_PORT:-8000}:8000"
    volumes:
      - ../chatty-core:/app
    depends_on:
      core-db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # chatty-chat (FastAPI), built from ../chatty-chat. The code is mounted, so --reload picks up changes.
  # Pending Alembic migrations are applied on every container start, like core.
  chat:
    build: ../chatty-chat
    image: chatty-chat:dev
    container_name: chatty-chat
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"
    env_file:
      - path: ../chatty-chat/.env
        required: false
    environment:
      # Service names and ports inside the network; these win over chatty-chat/.env.
      DATABASE_URL: postgresql+asyncpg://${CHAT_DB_USER:-chat_user}:${CHAT_DB_PASSWORD:-chat_pass}@chat-db:5432/${CHAT_DB_NAME:-chat_db}
      REDIS_URL: redis://redis:6379/0
      CORE_INTERNAL_URL: http://chatty-core:8000
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN:-change-me}
      JWT_PUBLIC_KEY_PATH: /keys/jwt_public.pem
      # File change events don't reach Linux containers from Windows mounts; poll instead.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:${CHAT_API_PORT:-8001}:8001"
    volumes:
      - ../chatty-chat:/app
      # Only the public half of core's key pair: chat verifies tokens, it never signs them.
      # Run setup.bat first. If the file is missing, Linux Docker fails here (create_host_path: false);
      # Docker Desktop ignores that and creates an empty folder instead, which setup.bat cleans up.
      - type: bind
        source: ../chatty-core/keys/jwt_public.pem
        target: /keys/jwt_public.pem
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      chat-db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  core-db-data:
  chat-db-data:
  redis-data:
  minio-data:
  kafka-data:
