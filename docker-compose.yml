name: chatty

services:
  core-db:
    image: postgres:17-alpine
    container_name: chatty-core-db
    environment:
      POSTGRES_USER: ${CORE_DB_USER:-core_user}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD:-core_pass}
      POSTGRES_DB: ${CORE_DB_NAME:-core_db}
    ports:
      - "127.0.0.1:${CORE_DB_PORT:-5432}:5432"
    volumes:
      - core-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  chat-db:
    image: postgres:17-alpine
    container_name: chatty-chat-db
    environment:
      POSTGRES_USER: ${CHAT_DB_USER:-chat_user}
      POSTGRES_PASSWORD: ${CHAT_DB_PASSWORD:-chat_pass}
      POSTGRES_DB: ${CHAT_DB_NAME:-chat_db}
    ports:
      - "127.0.0.1:${CHAT_DB_PORT:-5433}:5432"
    volumes:
      - chat-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: chatty-redis
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # minio/minio is no longer published on Docker Hub or Quay; Chainguard builds MinIO from source.
    image: cgr.dev/chainguard/minio:latest
    container_name: chatty-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_user}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_password}
      # Defines the "local" alias that the health check below uses.
      MC_HOST_local: http://${MINIO_ROOT_USER:-minio_user}:${MINIO_ROOT_PASSWORD:-minio_password}@localhost:9000
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "/usr/bin/mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-node KRaft (no Zookeeper). Apps run on the host, so the broker advertises localhost.
  kafka:
    image: apache/kafka:3.9.0
    container_name: chatty-kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # chatty-chat (FastAPI), built from ../chatty-chat. The code is mounted, so --reload picks up changes.
  chat:
    build: ../chatty-chat
    image: chatty-chat:dev
    container_name: chatty-chat
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    env_file:
      - path: ../chatty-chat/.env
        required: false
    environment:
      # Service names and ports inside the network; these win over chatty-chat/.env.
      DATABASE_URL: postgresql+asyncpg://${CHAT_DB_USER:-chat_user}:${CHAT_DB_PASSWORD:-chat_pass}@chat-db:5432/${CHAT_DB_NAME:-chat_db}
      REDIS_URL: redis://redis:6379/0
      CORE_SERVICE_TOKEN: ${CORE_SERVICE_TOKEN:-change-me}
      # File change events don't reach Linux containers from Windows mounts; poll instead.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "127.0.0.1:${CHAT_API_PORT:-8001}:8001"
    volumes:
      - ../chatty-chat:/app
    depends_on:
      chat-db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  core-db-data:
  chat-db-data:
  redis-data:
  minio-data:
  kafka-data:
